// ══════════════════════════════════════════ 행사 관리 (달력 + 상세) ══════════════════════════════════════════
function EventsPage({events,setEvents,role}){
  const[modal,setModal]=useState(false);
  const[sel,setSel]=useState(null);
  const[viewMode,setViewMode]=useState("calendar");
  const[calMonth,setCalMonth]=useState(new Date().getMonth());
  const[calYear,setCalYear]=useState(new Date().getFullYear());
  const[form,setForm]=useState({dept:"공통",title:"",date:TODAY,endDate:TODAY,location:"",type:"행사",desc:"",status:"기획중",budget:""});
  const typeIcon={수련회:"⛺",행사:"🎉",예배:"✝️",교육:"📚"};
  const typeColor={수련회:C.purple,행사:C.rose,예배:C.primary,교육:C.sky};
  const statusC={기획중:"gray",준비중:"amber",완료:"green"};
  const save=()=>{if(!form.title){alert("제목 필수");return;}setEvents(prev=>[...prev,{id:Date.now(),...form,budget:parseInt(form.budget)||0}]);setModal(false);};

  // 달력 로직
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const eventsOnDay=(d)=>{
    if(!d)return [];
    const ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    return events.filter(e=>ds>=e.date&&ds<=e.endDate);
  };
  const prevMonth=()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);};
  const nextMonth=()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);};

  // 상세 보기
  if(sel){
    const e=events.find(x=>x.id===sel.id)||sel;
    return <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}><Btn onClick={()=>setSel(null)}>← 목록</Btn></div>
      <Card>
        <div style={{background:typeColor[e.type]||C.primary,padding:"28px 32px",color:"#fff"}}>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <span style={{background:"rgba(255,255,255,.25)",padding:"3px 12px",borderRadius:20,fontSize:12,fontWeight:600}}>{e.dept}</span>
            <span style={{background:"rgba(255,255,255,.25)",padding:"3px 12px",borderRadius:20,fontSize:12,fontWeight:600}}>{typeIcon[e.type]} {e.type}</span>
            <span style={{background:"rgba(255,255,255,.25)",padding:"3px 12px",borderRadius:20,fontSize:12,fontWeight:600}}>{e.status}</span>
          </div>
          <div style={{fontSize:28,fontWeight:800}}>{e.title}</div>
        </div>
        <div style={{padding:"24px 32px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
            {[["📅 일정",e.date===e.endDate?dKr(e.date):`${dKr(e.date)} ~ ${dKr(e.endDate)}`],["📍 장소",e.location||"미정"],["💰 예산",e.budget>0?won(e.budget):"-"],["🏷 상태",e.status]].map(([k,v])=><div key={k} style={{padding:"12px 16px",background:C.surfaceL,borderRadius:10}}>
              <div style={{fontSize:11,color:C.textH,marginBottom:4}}>{k}</div>
              <div style={{fontSize:15,fontWeight:700,color:C.text}}>{v}</div>
            </div>)}
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:C.textS,marginBottom:8}}>행사 상세 내용</div>
            <div style={{fontSize:14,color:C.textS,lineHeight:1.8,padding:"14px 18px",background:C.surfaceL,borderRadius:12,whiteSpace:"pre-wrap"}}>{e.desc||"상세 내용이 없습니다."}</div>
          </div>
        </div>
      </Card>
    </div>;
  }

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div style={{fontSize:20,fontWeight:800}}>행사 관리</div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{display:"flex",gap:2,background:C.surfaceL,borderRadius:10,padding:3}}>
          {[["calendar","📅 달력"],["list","📋 목록"]].map(([k,l])=><button key={k} onClick={()=>setViewMode(k)} style={{padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:viewMode===k?C.surface:"transparent",color:viewMode===k?C.primary:C.textH,boxShadow:viewMode===k?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>)}
        </div>
        {(role==="admin"||role==="teacher")&&<Btn v="primary" onClick={()=>{setForm({dept:"공통",title:"",date:TODAY,endDate:TODAY,location:"",type:"행사",desc:"",status:"기획중",budget:""});setModal(true);}}>+ 행사 등록</Btn>}
      </div>
    </div>

    {viewMode==="calendar"?<Card>
      <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <Btn s="sm" onClick={prevMonth}>◀</Btn>
        <span style={{fontSize:16,fontWeight:800,color:C.text}}>{calYear}년 {calMonth+1}월</span>
        <Btn s="sm" onClick={nextMonth}>▶</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
        {["일","월","화","수","목","금","토"].map((d,i)=><div key={d} style={{padding:"10px",textAlign:"center",fontSize:12,fontWeight:700,color:i===0?C.danger:i===6?C.primary:C.textS,borderBottom:`1px solid ${C.border}`,background:C.surfaceL}}>{d}</div>)}
        {cells.map((d,i)=>{
          const evs=eventsOnDay(d);
          const isToday=d&&`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`===TODAY;
          return <div key={i} style={{minHeight:88,padding:"6px",borderBottom:`1px solid ${C.border}`,borderRight:(i+1)%7!==0?`1px solid ${C.border}`:"none",background:d?"#fff":C.surfaceL}}>
            {d&&<>
              <div style={{fontSize:12,fontWeight:isToday?800:500,color:isToday?"#fff":i%7===0?C.danger:i%7===6?C.primary:C.textS,width:isToday?22:"auto",height:isToday?22:"auto",background:isToday?C.primary:"transparent",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:4}}>{d}</div>
              {evs.slice(0,3).map(e=><div key={e.id} onClick={()=>setSel(e)} style={{fontSize:10,padding:"2px 5px",borderRadius:4,background:typeColor[e.type]+"22",color:typeColor[e.type],marginBottom:2,cursor:"pointer",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{typeIcon[e.type]} {e.title}</div>)}
              {evs.length>3&&<div style={{fontSize:9,color:C.textH,paddingLeft:4}}>+{evs.length-3}</div>}
            </>}
          </div>;
        })}
      </div>
    </Card>:<>
      {/* 목록 뷰 */}
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:12}}>📅 다가오는 행사</div>
      {events.filter(e=>e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).map(e=><Card key={e.id} style={{marginBottom:10,cursor:"pointer"}} onClick={()=>setSel(e)}>
        <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:52,height:52,borderRadius:16,background:typeColor[e.type]+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{typeIcon[e.type]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:6,marginBottom:5,flexWrap:"wrap"}}><DeptBadge dept={e.dept}/><Chip c="gray">{e.type}</Chip><Chip c={statusC[e.status]}>{e.status}</Chip></div>
            <div style={{fontSize:15,fontWeight:700}}>{e.title}</div>
            <div style={{fontSize:12,color:C.textH,marginTop:3}}>📅 {dKr(e.date)}{e.endDate!==e.date?` ~ ${dKr(e.endDate)}`:""} · 📍 {e.location}</div>
          </div>
          <span style={{color:C.textH,fontSize:18}}>›</span>
        </div>
      </Card>)}
      {events.filter(e=>e.date<TODAY).length>0&&<>
        <div style={{fontSize:14,fontWeight:700,color:C.text,margin:"20px 0 12px"}}>🗃 지난 행사</div>
        {events.filter(e=>e.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date)).map(e=><Card key={e.id} style={{marginBottom:6,cursor:"pointer",opacity:.7}} onClick={()=>setSel(e)}>
          <div style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:20}}>{typeIcon[e.type]}</span>
            <div style={{flex:1}}><span style={{fontWeight:600}}>{e.title}</span> <DeptBadge dept={e.dept}/></div>
            <span style={{fontSize:12,color:C.textH}}>{dKr(e.date)}</span>
          </div>
        </Card>)}
      </>}
    </>}

    <Modal open={modal} onClose={()=>setModal(false)} title="행사 등록" width={560}>
      <FG cols={2}>
        <FF label="대상 부서"><FSel value={form.dept} onChange={v=>setForm(f=>({...f,dept:v}))} options={["공통","중등부","고등부"]}/></FF>
        <FF label="행사 유형"><FSel value={form.type} onChange={v=>setForm(f=>({...f,type:v}))} options={["수련회","행사","예배","교육","기타"]}/></FF>
        <FF label="행사명" req span={2}><FI value={form.title} onChange={v=>setForm(f=>({...f,title:v}))}/></FF>
        <FF label="시작일"><FI type="date" value={form.date} onChange={v=>setForm(f=>({...f,date:v,endDate:f.endDate<v?v:f.endDate}))}/></FF>
        <FF label="종료일"><FI type="date" value={form.endDate} onChange={v=>setForm(f=>({...f,endDate:v}))}/></FF>
        <FF label="장소"><FI value={form.location} onChange={v=>setForm(f=>({...f,location:v}))}/></FF>
        <FF label="예산(원)"><FI type="number" value={form.budget} onChange={v=>setForm(f=>({...f,budget:v}))}/></FF>
        <FF label="상태"><FSel value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={["기획중","준비중","완료"]}/></FF>
        <FF label="상세 설명" span={2}><FTA value={form.desc} onChange={v=>setForm(f=>({...f,desc:v}))} rows={4} placeholder="행사 상세 내용, 준비물 등"/></FF>
      </FG>
      <div style={{padding:"0 20px 16px",display:"flex",gap:8}}><Btn v="primary" onClick={save}>등록</Btn><Btn onClick={()=>setModal(false)}>취소</Btn></div>
    </Modal>
  </div>;
}

// ══════════════════════════════════════════ 회의록 관리 ══════════════════════════════════════════
const MEETING_CATS=["교사회의","임원회의","부서모임","기타"];
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function MeetingsPage({meetings,setMeetings,role}){
  const[deptFilter,setDeptFilter]=useState("전체");
  const[modal,setModal]=useState(false);
  const[sel,setSel]=useState(null);
  const empty={dept:"공통",title:"",date:TODAY,category:"교사회의",author:"",type:"link",url:"",fileName:"",fileData:"",memo:""};
  const[form,setForm]=useState(empty);
  const[fileErr,setFileErr]=useState("");
  const canWrite=role==="admin"||role==="teacher";
  const filtered=(deptFilter==="전체"?meetings:meetings.filter(m=>m.dept===deptFilter||m.dept==="공통")).sort((a,b)=>b.date.localeCompare(a.date));

  const onPickFile=async(file)=>{
    setFileErr("");
    if(!file)return;
    if(file.size>4*1024*1024){ setFileErr("파일이 너무 큽니다 (4MB 이하만 첨부 가능). 큰 파일은 링크(구글드라이브 등)로 등록해주세요."); return; }
    try{ const data=await readFileAsDataURL(file); setForm(f=>({...f,fileName:file.name,fileData:data})); }
    catch(e){ setFileErr("파일을 읽는 중 오류가 발생했습니다."); }
  };
  const save=()=>{
    if(!form.title){alert("제목 필수");return;}
    if(form.type==="link"&&!form.url){alert("링크 URL을 입력해주세요.");return;}
    if(form.type==="file"&&!form.fileData){alert("첨부할 파일을 선택해주세요.");return;}
    setMeetings(prev=>[{id:Date.now(),...form,author:form.author||"-"},...prev]);
    setModal(false); setForm(empty); setFileErr("");
  };
  const del=(id)=>{ if(!window.confirm("이 회의록을 삭제할까요?"))return; setMeetings(prev=>prev.filter(m=>m.id!==id)); if(sel?.id===id)setSel(null); };
  const catColor={교사회의:"blue",임원회의:"purple",부서모임:"amber",기타:"gray"};

  if(sel){
    const m=meetings.find(x=>x.id===sel.id)||sel;
    return <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}><Btn onClick={()=>setSel(null)}>← 목록</Btn></div>
      <Card>
        <div style={{padding:"26px 30px"}}>
          <div style={{display:"flex",gap:6,marginBottom:12}}><DeptBadge dept={m.dept}/><Chip c={catColor[m.category]||"gray"}>{m.category}</Chip></div>
          <div style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:8}}>{m.title}</div>
          <div style={{fontSize:13,color:C.textH,marginBottom:20}}>{m.author} · {dKr(m.date)}</div>
          {m.memo&&<div style={{fontSize:14,color:C.textS,lineHeight:1.8,padding:"14px 18px",background:C.surfaceL,borderRadius:12,marginBottom:20,whiteSpace:"pre-wrap"}}>{m.memo}</div>}
          {m.type==="link"?
            <a href={m.url} target="_blank" rel="noopener noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"12px 20px",background:C.primaryL,color:C.primary,borderRadius:12,fontWeight:700,fontSize:14,textDecoration:"none"}}>🔗 회의 자료 링크 열기</a>
            :<a href={m.fileData} download={m.fileName} style={{display:"inline-flex",alignItems:"center",gap:8,padding:"12px 20px",background:C.primaryL,color:C.primary,borderRadius:12,fontWeight:700,fontSize:14,textDecoration:"none"}}>📎 {m.fileName} 다운로드</a>}
          {canWrite&&<div style={{marginTop:24}}><Btn v="danger" s="sm" onClick={()=>del(m.id)}>삭제</Btn></div>}
        </div>
      </Card>
    </div>;
  }

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <div><div style={{fontSize:20,fontWeight:800}}>회의록 관리</div><div style={{fontSize:13,color:C.textH,marginTop:2}}>회의 자료 링크·파일 보관함</div></div>
      {canWrite&&<Btn v="primary" onClick={()=>{setForm(empty);setFileErr("");setModal(true);}}>+ 회의록 등록</Btn>}
    </div>
    <div style={{display:"flex",gap:4,marginBottom:16,flexWrap:"wrap"}}>
      {["전체","공통","중등부","고등부"].map(d=><button key={d} onClick={()=>setDeptFilter(d)} style={{padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:d===deptFilter?C.primary:C.surfaceL,color:d===deptFilter?"#fff":C.textS}}>{d}</button>)}
    </div>
    {filtered.length===0?<div style={{textAlign:"center",padding:48,color:C.textH}}>등록된 회의록이 없습니다</div>
    :<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {filtered.map(m=><Card key={m.id} style={{cursor:"pointer"}} onClick={()=>setSel(m)}>
        <div style={{padding:"15px 20px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:44,height:44,borderRadius:14,background:C.primaryL,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{m.type==="link"?"🔗":"📎"}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}><DeptBadge dept={m.dept}/><Chip c={catColor[m.category]||"gray"}>{m.category}</Chip></div>
            <div style={{fontSize:14,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.title}</div>
            <div style={{fontSize:12,color:C.textH,marginTop:2}}>{m.author} · {dKr(m.date)}</div>
          </div>
          <span style={{color:C.textH,fontSize:18}}>›</span>
        </div>
      </Card>)}
    </div>}

    <Modal open={modal} onClose={()=>setModal(false)} title="회의록 등록" width={560}>
      <FG cols={2}>
        <FF label="대상 부서"><FSel value={form.dept} onChange={v=>setForm(f=>({...f,dept:v}))} options={["공통","중등부","고등부"]}/></FF>
        <FF label="분류"><FSel value={form.category} onChange={v=>setForm(f=>({...f,category:v}))} options={MEETING_CATS}/></FF>
        <FF label="제목" req span={2}><FI value={form.title} onChange={v=>setForm(f=>({...f,title:v}))} placeholder="예: 2026년 3분기 교사회의"/></FF>
        <FF label="날짜"><FI type="date" value={form.date} onChange={v=>setForm(f=>({...f,date:v}))}/></FF>
        <FF label="작성자"><FI value={form.author} onChange={v=>setForm(f=>({...f,author:v}))} placeholder="이름 입력"/></FF>
        <FF label="자료 유형" span={2}>
          <div style={{display:"flex",gap:6}}>
            {[["link","🔗 링크"],["file","📎 파일 첨부"]].map(([v,l])=><button key={v} onClick={()=>setForm(f=>({...f,type:v}))} style={{flex:1,padding:"9px 12px",borderRadius:9,fontSize:13,fontWeight:600,cursor:"pointer",border:`1px solid ${form.type===v?C.primary:C.borderS}`,background:form.type===v?C.primaryL:C.surface,color:form.type===v?C.primary:C.textS}}>{l}</button>)}
          </div>
        </FF>
        {form.type==="link"?
          <FF label="링크 URL" req span={2}><FI value={form.url} onChange={v=>setForm(f=>({...f,url:v}))} placeholder="https://docs.google.com/..."/></FF>
          :<FF label="파일 첨부 (4MB 이하)" req span={2}>
            <input type="file" onChange={e=>onPickFile(e.target.files[0])} style={{...iS,padding:"7px 11px"}}/>
            {form.fileName&&<div style={{fontSize:12,color:C.primary,marginTop:6,fontWeight:600}}>✓ {form.fileName}</div>}
            {fileErr&&<div style={{fontSize:12,color:C.danger,marginTop:6}}>{fileErr}</div>}
          </FF>}
        <FF label="메모" span={2}><FTA value={form.memo} onChange={v=>setForm(f=>({...f,memo:v}))} rows={3} placeholder="회의 요약, 결정사항 등"/></FF>
      </FG>
      <div style={{padding:"0 20px 16px",display:"flex",gap:8}}><Btn v="primary" onClick={save}>등록</Btn><Btn onClick={()=>setModal(false)}>취소</Btn></div>
    </Modal>
  </div>;
}

// ══════════════════════════════════════════ APP ROOT ══════════════════════════════════════════
function SuseoChurchERP(){
  const[loggedIn,setLoggedIn]=useState(false);
  const[role,setRole]=useState("");const[userId,setUserId]=useState("");const[parentStudentId,setParentStudentId]=useState(null);
  const[page,setPage]=useState("home");const[sideOpen,setSideOpen]=useState(false);
  const[isMobile,setMobile]=useState(typeof window!=="undefined"&&window.innerWidth<768);
  useEffect(()=>{const h=()=>setMobile(window.innerWidth<768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  // ══════════ Supabase 연동 ══════════
  const SUPA_URL="https://lfpfanflskjdqwbbqopo.supabase.co";
  const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcGZhbmZsc2tqZHF3YmJxb3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NjgwMjksImV4cCI6MjA5ODU0NDAyOX0.rbEZHLLOpVfqPY9IXQ6AqejHTa8eAOrYr_5Vnw5van8";
  const TABLE="app_data";
  const supaHeaders={ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" };

  const[syncStatus,setSyncStatus]=useState("connecting"); // connecting/online/offline
  const[lastSync,setLastSync]=useState(null);
  const bootRef=React.useRef(false);       // 초기 로드 완료 여부
  const localRev=React.useRef(0);          // 로컬 변경 리비전
  const pushedRev=React.useRef(0);         // 서버에 반영한 리비전
  const remoteHash=React.useRef("");       // 마지막으로 본 서버 데이터 해시

  // localStorage 폴백
  const lsLoad=(key,def)=>{try{if(typeof window==="undefined"||!window.localStorage)return def;const v=window.localStorage.getItem("suseo_"+key);return v?JSON.parse(v):def;}catch(e){return def;}};
  const lsSave=(key,val)=>{try{if(typeof window!=="undefined"&&window.localStorage)window.localStorage.setItem("suseo_"+key,JSON.stringify(val));}catch(e){}};

  const[students,setStudents]=useState(()=>lsLoad("students",STUDENTS0));
  const[teachers,setTeachers]=useState(()=>lsLoad("teachers",TEACHERS0));
  const[attendance,setAttendance]=useState(()=>lsLoad("attendance",ATTEND0));
  const[expenses,setExpenses]=useState(()=>lsLoad("expenses",EXPENSES0));
  const[budgets,setBudgets]=useState(()=>lsLoad("budgets",BUDGETS0));
  const[events,setEvents]=useState(()=>lsLoad("events",EVENTS0));
  const[notices,setNotices]=useState(()=>lsLoad("notices",NOTICES0));
  const[prayers,setPrayers]=useState(()=>lsLoad("prayers",PRAYERS0));
  const[bulletins,setBulletins]=useState(()=>lsLoad("bulletins",BULLETINS0));
  const[meetings,setMeetings]=useState(()=>lsLoad("meetings",MEETINGS0));

  const collect=()=>({students,teachers,attendance,expenses,budgets,events,notices,prayers,bulletins,meetings});
  const applyData=(d)=>{
    if(!d)return;
    if(d.students)setStudents(d.students);
    if(d.teachers)setTeachers(d.teachers);
    if(d.attendance)setAttendance(d.attendance);
    if(d.expenses)setExpenses(d.expenses);
    if(d.budgets)setBudgets(d.budgets);
    if(d.events)setEvents(d.events);
    if(d.notices)setNotices(d.notices);
    if(d.prayers)setPrayers(d.prayers);
    if(d.bulletins)setBulletins(d.bulletins);
    if(d.meetings)setMeetings(d.meetings);
    ["students","teachers","attendance","expenses","budgets","events","notices","prayers","bulletins","meetings"].forEach(k=>{if(d[k])lsSave(k,d[k]);});
  };

  // 서버에서 데이터 가져오기
  const fetchRemote=async()=>{
    const res=await fetch(`${SUPA_URL}/rest/v1/${TABLE}?key=eq.main&select=value`,{headers:supaHeaders});
    if(!res.ok)throw new Error("fetch "+res.status);
    const rows=await res.json();
    return rows&&rows[0]?rows[0].value:null;
  };
  // 서버에 저장 (upsert)
  const pushRemote=async(data)=>{
    const body=[{key:"main",value:data,updated_at:new Date().toISOString()}];
    const res=await fetch(`${SUPA_URL}/rest/v1/${TABLE}?on_conflict=key`,{
      method:"POST",
      headers:{...supaHeaders,"Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(body),
    });
    if(!res.ok)throw new Error("push "+res.status);
  };

  // 최초 1회: 서버 데이터 로드 (없으면 현재 데이터로 초기화)
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        setSyncStatus("connecting");
        const remote=await fetchRemote();
        if(!alive)return;
        if(remote){ applyData(remote); remoteHash.current=JSON.stringify(remote); }
        else { const init=collect(); await pushRemote(init); remoteHash.current=JSON.stringify(init); }
        setSyncStatus("online"); setLastSync(new Date());
      }catch(e){ if(alive)setSyncStatus("offline"); }
      finally{ if(alive){ bootRef.current=true; pushedRev.current=localRev.current; } }
    })();
    return ()=>{alive=false;};
  },[]);

  // 로컬 변경 감지 → 리비전 증가 + localStorage 백업
  useEffect(()=>{ if(bootRef.current){ localRev.current++; } 
    lsSave("students",students);lsSave("teachers",teachers);lsSave("attendance",attendance);lsSave("expenses",expenses);lsSave("budgets",budgets);lsSave("events",events);lsSave("notices",notices);lsSave("prayers",prayers);lsSave("bulletins",bulletins);lsSave("meetings",meetings);
  },[students,teachers,attendance,expenses,budgets,events,notices,prayers,bulletins,meetings]);

  // 주기적 동기화: 로컬 변경분 push + 서버 변경분 pull (3초마다)
  useEffect(()=>{
    const timer=setInterval(async()=>{
      if(!bootRef.current)return;
      try{
        // 1) 로컬 변경이 있으면 서버에 push
        if(localRev.current!==pushedRev.current){
          const data=collect();
          await pushRemote(data);
          remoteHash.current=JSON.stringify(data);
          pushedRev.current=localRev.current;
          setSyncStatus("online"); setLastSync(new Date());
        } else {
          // 2) 로컬 변경이 없으면 서버에서 최신 데이터 pull
          const remote=await fetchRemote();
          const h=JSON.stringify(remote);
          if(remote&&h!==remoteHash.current){
            remoteHash.current=h;
            applyData(remote);
            localRev.current=pushedRev.current; // 원격 반영은 로컬 변경으로 치지 않음
          }
          setSyncStatus("online"); setLastSync(new Date());
        }
      }catch(e){ setSyncStatus("offline"); }
    },3000);
    return ()=>clearInterval(timer);
  },[students,teachers,attendance,expenses,budgets,events,notices,prayers,bulletins,meetings]);

  // 데이터 초기화 (서버 + 로컬 모두 기본값으로)
  const resetAll=async()=>{
    if(!window.confirm("모든 데이터를 초기 상태로 되돌립니다. 서버 데이터도 초기화됩니다. 계속할까요?"))return;
    const init={students:STUDENTS0,teachers:TEACHERS0,attendance:ATTEND0,expenses:EXPENSES0,budgets:BUDGETS0,events:EVENTS0,notices:NOTICES0,prayers:PRAYERS0,bulletins:BULLETINS0,meetings:MEETINGS0};
    try{ await pushRemote(init); }catch(e){}
    try{ Object.keys(window.localStorage).filter(k=>k.startsWith("suseo_")).forEach(k=>window.localStorage.removeItem(k)); }catch(e){}
    window.location.reload();
  };

  const handleLogin=(r,id,sid)=>{setRole(r);setUserId(id);setParentStudentId(sid);setLoggedIn(true);setPage("home");};
  const handleLogout=()=>{setLoggedIn(false);setRole("");setUserId("");setParentStudentId(null);setPage("home");};
  if(!loggedIn)return <LoginPage onLogin={handleLogin}/>;

  const menu=role==="admin"?ADMIN_MENU:role==="teacher"?TEACHER_MENU:PARENT_MENU;
  const label=flattenMenu(menu).find(m=>m.k===page)?.label||"현황";
  const blocked=role==="teacher"&&["budget","teachers"].includes(page);

  // ══════════ 알림 센터: 심방 필요 학생 · 예산 초과 · 임박한 행사 ══════════
  const alertItems=role==="parent"?[]:(()=>{
    const items=[];
    students.forEach(s=>{
      const streak=consecutiveAbsences(s.id,attendance);
      if(streak>=2)items.push({icon:"🚨",title:`${s.name} 학생 ${streak}주 연속 결석`,sub:`${s.dept} · ${s.banName} · 심방이 필요합니다`,onClick:()=>setPage("students")});
    });
    if(role==="admin"){
      Object.entries(budgets).forEach(([dept,byYear])=>{
        const yb=byYear[2026]; if(!yb)return;
        yb.items.forEach(it=>{
          const spent=expenses.filter(e=>e.dept===dept&&e.year===2026&&e.category===it.name).reduce((s,e)=>s+e.amount,0);
          if(it.budget>0&&spent>it.budget)items.push({icon:"💸",title:`${dept} '${it.name}' 예산 초과`,sub:`집행 ${won(spent)} / 배정 ${won(it.budget)}`,onClick:()=>setPage("budget")});
        });
      });
    }
    events.filter(e=>e.date>=TODAY&&e.date<=addDays(TODAY,7)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      items.push({icon:"🗓",title:`${e.title} (D-${dayDiff(TODAY,e.date)})`,sub:`${dKr(e.date)} · ${e.location||"장소 미정"}`,onClick:()=>setPage("events")});
    });
    return items;
  })();

  const syncCfg={connecting:{c:C.warn,bg:C.warnL,t:"동기화 연결 중",dot:"🟡"},online:{c:C.success,bg:C.successL,t:"실시간 동기화 중",dot:"🟢"},offline:{c:C.danger,bg:C.dangerL,t:"오프라인 (기기 저장)",dot:"🔴"}};
  const sc=syncCfg[syncStatus]||syncCfg.connecting;
  const SyncBadge=({compact})=><span title={sc.t} style={{display:"inline-flex",alignItems:"center",gap:5,padding:compact?"2px 8px":"5px 12px",borderRadius:20,background:sc.bg,color:sc.c,fontSize:compact?10:12,fontWeight:700,whiteSpace:"nowrap"}}>
    <span style={{width:7,height:7,borderRadius:"50%",background:sc.c,display:"inline-block",animation:syncStatus==="online"?"none":"none"}}/>{compact?(syncStatus==="online"?"동기화":syncStatus==="offline"?"오프라인":"연결중"):sc.t}
  </span>;

  return <div style={{display:"flex",height:"100vh",fontFamily:"'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif",background:C.bg,color:C.text,overflow:"hidden"}}>
    <Sidebar page={page} setPage={p=>{setPage(p);setSideOpen(false);}} role={role} onLogout={handleLogout} mobile={isMobile} open={sideOpen} onClose={()=>setSideOpen(false)}/>
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
      <div style={{background:"rgba(255,255,255,.82)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",borderBottom:`1px solid ${C.border}`,padding:isMobile?"11px 16px":"10px 24px",display:"flex",alignItems:"center",gap:10,flexShrink:0,position:"sticky",top:0,zIndex:40}}>
        {isMobile&&<button onClick={()=>setSideOpen(true)} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",padding:2}}>☰</button>}
        <span style={{fontSize:isMobile?15:14,fontWeight:700,color:isMobile?C.text:C.textS}}>{label}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:isMobile?8:10}}>{role!=="parent"&&<NotifBell items={alertItems}/>}<SyncBadge compact={isMobile}/></div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:isMobile?"14px":"24px 30px"}}>
        {blocked?<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"50vh",gap:12}}>
          <div style={{fontSize:52}}>🔒</div>
          <div style={{fontSize:18,fontWeight:700,color:C.textS}}>접근 권한이 없습니다</div>
          <div style={{fontSize:13,color:C.textH}}>이 화면은 전도사님/부장님 전용입니다</div>
          <Btn v="primary" onClick={()=>setPage("home")}>홈으로 돌아가기</Btn>
        </div>:<>
          {page==="home"&&<Dashboard role={role} students={students} teachers={teachers} attendance={attendance} notices={notices} events={events} prayers={prayers} setPage={setPage} parentStudentId={parentStudentId}/>}
          {page==="attendance"&&<AttendancePage students={students} attendance={attendance} setAttendance={setAttendance}/>}
          {page==="bulletin"&&<BulletinPage bulletins={bulletins} setBulletins={setBulletins} role={role} notices={notices}/>}
          {page==="students"&&<StudentsPage students={students} setStudents={setStudents} prayers={prayers} attendance={attendance}/>}
          {page==="teachers"&&<TeachersPage teachers={teachers} setTeachers={setTeachers}/>}
          {page==="prayer"&&<PrayerPage prayers={prayers} setPrayers={setPrayers} students={students} role={role} parentStudentId={parentStudentId}/>}
          {page==="notice"&&<NoticePage notices={notices} setNotices={setNotices} role={role}/>}
          {page==="meetings"&&<MeetingsPage meetings={meetings} setMeetings={setMeetings} role={role}/>}
          {page==="budget"&&<BudgetPage budgets={budgets} setBudgets={setBudgets} expenses={expenses} setExpenses={setExpenses}/>}
          {page==="events"&&<EventsPage events={events} setEvents={setEvents} role={role}/>}
        </>}
      </div>
    </div>
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SuseoChurchERP));
</script>
<script>
if('serviceWorker' in navigator){
  const swCode = `const CACHE='suseo-v3';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(u.hostname.includes('supabase.co')){return;}e.respondWith(caches.open(CACHE).then(cache=>cache.match(e.request).then(cached=>{const f=fetch(e.request).then(res=>{if(e.request.method==='GET'&&res.status===200){cache.put(e.request,res.clone());}return res;}).catch(()=>cached);return cached||f;})));});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
let deferredPrompt=null;
const banner=document.getElementById('installBanner'),btn=document.getElementById('installBtn'),closeBtn=document.getElementById('installClose');

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!isStandalone)banner.style.display='flex';});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;banner.style.display='none';}});
closeBtn.addEventListener('click',()=>{banner.style.display='none';});
window.addEventListener('appinstalled',()=>{banner.style.display='none';});
if(isIOS&&!isStandalone){banner.querySelector('div div:first-child').textContent='홈 화면에 추가하기';banner.querySelector('div div:last-child').textContent='공유 버튼 → "홈 화면에 추가"를 눌러주세요';btn.style.display='none';banner.style.display='flex';}
</script>
